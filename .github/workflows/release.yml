# Cuts a GitHub Release for whatever version package.json names, every time main
# moves — a merged pull request or a direct push, it makes no difference. The
# browser bundle is attached to it, which is what makes the stable download URL
# work:
#
#   https://github.com/ali3nnn/webchat-sdk/releases/latest/download/webchatsdk.js
#
# So releasing is: bump the version in package.json (`npm version <major|minor|
# patch>`), merge it, done. A commit that does not change the version — a README
# fix, a refactor — finds its version already released and stops without cutting
# anything, so main can move as often as it likes.
#
# The bundle is built here rather than committed, so the asset always matches the
# released source.
name: Release

on:
  push:
    branches:
      - main
  # Re-run by hand if a release job failed after the version was already merged.
  workflow_dispatch:

permissions:
  contents: write

# Two merges in quick succession must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated by diffing against the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Asking for the release rather than the tag: a tag can exist without one
      # (an interrupted run, or a tag pushed by hand), and that should still
      # publish rather than skip forever.
      - name: Does this version still need releasing?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released. Bump the version in package.json to cut a new release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing $tag."
          fi
          # A tag left over from `npm version` on a branch points at the branch
          # commit, not at what was merged. Releasing onto it would attach
          # assets built here to source from somewhere else, so stop instead.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged="$(git rev-list -n 1 "$tag")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already points at $tagged, not at this commit. Delete that tag (git push --delete origin $tag) or bump the version again."
              exit 1
            fi
          fi

      - if: steps.check.outputs.release == 'true'
        run: npm ci
      - if: steps.check.outputs.release == 'true'
        run: npm run typecheck
      - if: steps.check.outputs.release == 'true'
        run: npm run build

      - name: Publish release with the bundle attached
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Tags this commit; the tag does not have to exist beforehand.
          tag_name: ${{ steps.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/webchatsdk.js
            dist/webchatsdk.js.map
          generate_release_notes: true
