# Cuts a GitHub Release whenever a v* tag is pushed, and attaches the browser
# bundle to it. That is what makes the stable download URL work:
#
#   https://github.com/ali3nnn/webchat-sdk/releases/latest/download/webchatsdk.js
#
# The bundle is built here rather than committed, so the asset always matches
# the tagged source. To release: npm version <major|minor|patch> && git push --follow-tags
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Publish release with the bundle attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/webchatsdk.js
            dist/webchatsdk.js.map
          generate_release_notes: true
